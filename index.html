<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Debate Arena</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
    }

    #input-area {
      margin: 20px;
      width: 60%;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #4caf50;
      color: black;
    }

    #debate-container {
      display: flex;
      gap: 20px;
      width: 90%;
      max-width: 1000px;
      margin-top: 20px;
    }

    .box {
      flex: 1;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      min-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .title {
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>AI vs AI Debate</h1>

  <div id="input-area">
    <input id="topicInput" type="text" placeholder="Enter a debate topic (e.g. Is God real?)">
    <button onclick="startDebate()">Start</button>
  </div>

  <div id="debate-container">
    <div class="box">
      <div class="title">AI A</div>
      <div id="aiA"></div>
    </div>

    <div class="box">
      <div class="title">AI B</div>
      <div id="aiB"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
