<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Debate Arena</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1220;
      color: #eaeaf0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Center input */
    .input-area {
      display: flex;
      justify-content: center;
      padding: 20px;
      border-bottom: 1px solid #2a2d4a;
    }

    .input-area input {
      width: 60%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    /* Debate boxes */
    .debate-area {
      display: flex;
      flex: 1;
    }

    .box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #2a2d4a;
    }

    .box:last-child {
      border-right: none;
    }

    .box h2 {
      text-align: center;
      margin-top: 0;
      color: #9fa8ff;
    }

    .message {
      background: #1b1f3a;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    /* Scrollbar polish */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <!-- Topic Input -->
  <div class="input-area">
    <input
      id="topicInput"
      type="text"
      placeholder="Enter a debate topic (e.g. Is God real?)"
      onkeydown="handleEnter(event)"
    />
  </div>

  <!-- Debate Output -->
  <div class="debate-area">
    <div class="box" id="ai1">
      <h2>AI One</h2>
    </div>

    <div class="box" id="ai2">
      <h2>AI Two</h2>
    </div>
  </div>

  <script>
    function handleEnter(event) {
      if (event.key === "Enter") {
        startDebate();
      }
    }

    function startDebate() {
      const topic = document.getElementById("topicInput").value.trim();
      if (!topic) return;

      clearBoxes();

      addMessage("ai1", `Debate topic received: "${topic}"`);
      addMessage("ai2", `Acknowledged. Preparing counter-position.`);

      // Placeholder for real-time AI logic
      // This is where n8n / polling / APIs will hook in
    }

    function addMessage(boxId, text) {
      const box = document.getElementById(boxId);
      const div = document.createElement("div");
      div.className = "message";
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearBoxes() {
      document.getElementById("ai1").innerHTML = "<h2>AI One</h2>";
      document.getElementById("ai2").innerHTML = "<h2>AI Two</h2>";
    }
  </script>

</body>
</html>
